<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aires Burger — Usuarios</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<div class="topbar">
  <div>
    <p style="font-size:10px;text-transform:uppercase;letter-spacing:1.6px;color:var(--text-2)">AIRES BURGER · ADMIN</p>
    <h1>Gestión de usuarios</h1>
  </div>
  <div class="actions">
    <a href="/dashboard">← Dashboard</a>
    <button onclick="logout()">Salir</button>
  </div>
</div>

<div class="card" style="margin-bottom:1rem">
  <p style="font-size:13px;font-weight:500;margin-bottom:.75rem">Crear usuario</p>
  <form id="create-form" style="display:grid;grid-template-columns:1fr 1fr 140px 90px;gap:8px;align-items:end">
    <div>
      <label style="display:block;font-size:11px;color:var(--text-2);margin-bottom:4px;text-transform:uppercase">Email</label>
      <input id="cf-email" type="email" required style="width:100%;padding:6px 8px;border:.5px solid var(--border-2);border-radius:6px;background:var(--bg-secondary);color:var(--text);font-size:13px">
    </div>
    <div>
      <label style="display:block;font-size:11px;color:var(--text-2);margin-bottom:4px;text-transform:uppercase">Contraseña</label>
      <input id="cf-pass" type="text" required style="width:100%;padding:6px 8px;border:.5px solid var(--border-2);border-radius:6px;background:var(--bg-secondary);color:var(--text);font-size:13px">
    </div>
    <div>
      <label style="display:block;font-size:11px;color:var(--text-2);margin-bottom:4px;text-transform:uppercase">Rol</label>
      <select id="cf-role" style="width:100%;padding:6px 8px;border:.5px solid var(--border-2);border-radius:6px;background:var(--bg-secondary);color:var(--text);font-size:13px"></select>
    </div>
    <button type="submit" style="padding:7px;border:none;border-radius:6px;background:#185FA5;color:#fff;cursor:pointer;font-weight:500;font-size:13px">Crear</button>
  </form>
  <p id="create-msg" style="margin-top:8px;font-size:12px"></p>
</div>

<div class="card">
  <p style="font-size:13px;font-weight:500;margin-bottom:.75rem">Usuarios existentes (máx. 5)</p>
  <div style="overflow-x:auto">
    <table>
      <thead><tr>
        <th>ID</th><th>Email</th><th>Rol</th><th>2FA</th><th>Creado</th><th style="text-align:right">Acciones</th>
      </tr></thead>
      <tbody id="users-tbody"></tbody>
    </table>
  </div>
</div>

<div class="save-pill" id="save-pill">Guardado</div>

<script src="/js/api.js"></script>
<script>
async function loadUsers() {
  const r = await fetch('/api/v1/users', { credentials: 'same-origin' });
  if (r.status === 401) return location.href = '/login';
  if (r.status === 403) { document.body.innerHTML = '<p style="padding:2rem">No tenés permisos para acceder a esta página.</p>'; return; }
  const j = await r.json();
  const max = j.max_users || 10;
  const hdr = document.querySelector('.card:last-of-type p');
  if (hdr) hdr.textContent = `Usuarios existentes (${j.users.length} / ${max})`;
  // Poblar dropdown de roles
  const roleSel = document.getElementById('cf-role');
  const roleLabels = j.role_labels || {};
  roleSel.innerHTML = (j.roles || ['socio','admin']).map((r) => {
    const lbl = roleLabels[r] || r;
    const sel = r === 'socio' ? ' selected' : '';
    return `<option value="${r}"${sel}>${lbl}</option>`;
  }).join('');
  const tbody = document.getElementById('users-tbody');
  tbody.innerHTML = j.users.map((u) => `<tr>
    <td>${u.id}</td>
    <td style="font-weight:500">${u.email}</td>
    <td><span class="bdg b${u.role === 'admin' ? 'A' : u.role === 'socio' ? 'C' : 'B'}">${roleLabels[u.role] || u.role}</span></td>
    <td>${u.totp_enabled ? '<span class="bdg bV">2FA on</span>' : '<span class="bdg bJ">sin 2FA</span>'}</td>
    <td style="font-size:11px;color:var(--text-2)">${new Date(u.created_at).toLocaleString('es-ES')}</td>
    <td style="text-align:right">
      <button onclick="changePass(${u.id})" style="padding:3px 8px;font-size:11px;border:.5px solid var(--border-2);border-radius:4px;background:transparent;cursor:pointer">Cambiar pass</button>
      ${u.totp_enabled ? `<button onclick="resetTotp(${u.id})" style="padding:3px 8px;font-size:11px;border:.5px solid var(--border-2);border-radius:4px;background:transparent;cursor:pointer;color:#BA7517">Reset 2FA</button>` : ''}
      <button onclick="delUser(${u.id})" style="padding:3px 8px;font-size:11px;border:.5px solid var(--border-2);border-radius:4px;background:transparent;cursor:pointer;color:#dc2626">Borrar</button>
    </td>
  </tr>`).join('');
}

async function resetTotp(id) {
  if (!confirm('¿Desactivar 2FA de este usuario? Va a tener que reactivarlo desde /account.')) return;
  const r = await fetch(`/api/v1/users/${id}/2fa`, { method: 'DELETE', credentials: 'same-origin' });
  if (!r.ok) alert((await r.json()).error || 'Error');
  else { Api.pill('2FA reseteado'); loadUsers(); }
}

document.getElementById('create-form').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const msg = document.getElementById('create-msg');
  msg.textContent = '';
  try {
    await Api.jsonFetch?.call(null, '/api/v1/users', {
      method: 'POST',
      body: JSON.stringify({
        email: document.getElementById('cf-email').value,
        password: document.getElementById('cf-pass').value,
        role: document.getElementById('cf-role').value,
      }),
    }) || (await fetch('/api/v1/users', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        email: document.getElementById('cf-email').value,
        password: document.getElementById('cf-pass').value,
        role: document.getElementById('cf-role').value,
      }),
    }).then(async (r) => { const j = await r.json(); if (!r.ok) throw new Error(j.error); }));
    msg.textContent = 'Creado'; msg.style.color = '#16a34a';
    document.getElementById('create-form').reset();
    loadUsers();
  } catch (e) {
    msg.textContent = e.message || 'Error'; msg.style.color = '#dc2626';
  }
});

async function changePass(id) {
  const pass = prompt('Nueva contraseña:');
  if (!pass) return;
  const r = await fetch(`/api/v1/users/${id}/password`, {
    method: 'PUT', credentials: 'same-origin',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ password: pass }),
  });
  if (!r.ok) alert((await r.json()).error || 'Error');
  else Api.pill('Contraseña actualizada');
}

async function delUser(id) {
  if (!confirm('¿Borrar usuario?')) return;
  const r = await fetch(`/api/v1/users/${id}`, { method: 'DELETE', credentials: 'same-origin' });
  if (!r.ok) alert((await r.json()).error || 'Error');
  else loadUsers();
}

async function logout() {
  await fetch('/api/v1/auth/logout', { method: 'POST', credentials: 'same-origin' });
  location.href = '/login';
}

loadUsers();
</script>
</body>
</html>
