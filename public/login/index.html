<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aires Burger — Acceso</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div class="login-box">
  <p style="font-size:11px;text-transform:uppercase;letter-spacing:1.8px;color:var(--text-2);margin-bottom:4px">AIRES BURGER</p>
  <h1>Análisis de rentabilidad</h1>

  <!-- PASO 1 -->
  <form id="loginForm">
    <label for="email">Email</label>
    <input id="email" type="email" required autocomplete="username">
    <label for="password">Contraseña</label>
    <input id="password" type="password" required autocomplete="current-password">
    <div class="err" id="err"></div>
    <button type="submit" id="btn">Entrar</button>
  </form>

  <!-- PASO 2 (2FA) -->
  <form id="otpForm" style="display:none">
    <p style="font-size:12px;color:var(--text-2);margin-bottom:1rem">
      Ingresá el código de 6 dígitos de tu app autenticadora.
    </p>
    <label for="code">Código 2FA</label>
    <input id="code" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6"
      autocomplete="one-time-code" required
      style="text-align:center;font-size:22px;letter-spacing:8px">
    <div class="err" id="err2"></div>
    <button type="submit" id="btn2">Verificar</button>
    <button type="button" onclick="resetFlow()" style="margin-top:10px;width:100%;padding:8px;border:.5px solid var(--border-2);border-radius:var(--r-md);background:transparent;color:var(--text);cursor:pointer;font-size:12px">Cancelar y volver</button>
  </form>
</div>

<script>
const form = document.getElementById('loginForm');
const otpForm = document.getElementById('otpForm');
const btn = document.getElementById('btn');
const btn2 = document.getElementById('btn2');
const err = document.getElementById('err');
const err2 = document.getElementById('err2');

form.addEventListener('submit', async (ev) => {
  ev.preventDefault();
  err.textContent = ''; btn.disabled = true; btn.textContent = 'Entrando...';
  try {
    const r = await fetch('/api/v1/auth/login', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
      }),
    });
    const j = await r.json();
    if (!r.ok) { err.textContent = j.error || 'Error'; btn.disabled = false; btn.textContent = 'Entrar'; return; }
    if (j.needs2fa) {
      form.style.display = 'none';
      otpForm.style.display = '';
      document.getElementById('code').focus();
      return;
    }
    location.href = '/dashboard';
  } catch (e) {
    err.textContent = 'Error de red'; btn.disabled = false; btn.textContent = 'Entrar';
  }
});

otpForm.addEventListener('submit', async (ev) => {
  ev.preventDefault();
  err2.textContent = ''; btn2.disabled = true; btn2.textContent = 'Verificando...';
  try {
    const r = await fetch('/api/v1/auth/login/2fa', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ code: document.getElementById('code').value }),
    });
    const j = await r.json();
    if (!r.ok) { err2.textContent = j.error || 'Error'; btn2.disabled = false; btn2.textContent = 'Verificar'; return; }
    location.href = '/dashboard';
  } catch (e) {
    err2.textContent = 'Error de red'; btn2.disabled = false; btn2.textContent = 'Verificar';
  }
});

function resetFlow() {
  otpForm.style.display = 'none';
  form.style.display = '';
  btn.disabled = false; btn.textContent = 'Entrar';
  document.getElementById('code').value = '';
  err.textContent = ''; err2.textContent = '';
}
</script>
</body>
</html>
